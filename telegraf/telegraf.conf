[global_tags]
  environment = "dev"

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "10s"

# --- Outputs ---

[[outputs.influxdb_v2]]
  urls = ["${INFLUXDB_URL}"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"

# --- System metrics ---

[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = false
  [inputs.cpu.tags]
    service = "system"

[[inputs.mem]]
  [inputs.mem.tags]
    service = "system"

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]
  [inputs.disk.tags]
    service = "system"

[[inputs.net]]
  interfaces = ["eth*", "en*"]
  [inputs.net.tags]
    service = "system"

[[inputs.system]]
  [inputs.system.tags]
    service = "system"

# --- HTTP response checks ---

[[inputs.http_response]]
  urls = ["https://github.com"]
  response_timeout = "5s"
  method = "GET"
  follow_redirects = true
  [inputs.http_response.tags]
    service = "external"
    target = "github"

# --- Business metrics via exec ---

[[inputs.exec]]
  commands = ["/etc/telegraf/scripts/business-metrics.sh"]
  timeout = "5s"
  data_format = "influx"
  [inputs.exec.tags]
    service = "business"
